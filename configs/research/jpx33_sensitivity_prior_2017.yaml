experiment_id: 20260924_jpx33_sensitivity_prior
purpose: >
  Translate ex-ante JPX 33-industry sensitivity scores into the existing
  TOPIX-17 ETF labels using a fixed, pre-evaluation market-cap snapshot.
  The BLPX target and output dimension remain the production 17 ETFs.

provenance:
  taxonomy: JPX 33 industry classifications mapped to TOPIX-17
  taxonomy_source: https://www.jpx.co.jp/markets/indices/factsheets/files/000_fac2_sector.pdf
  market_cap_as_of: "2017-12-29"
  market_cap_unit: million_yen
  market_cap_source: https://www.jpx.co.jp/markets/statistics-equities/misc/nlsgeu000002vgd0-att/201712.pdf
  market_cap_universe: Tokyo Stock Exchange First Section

sensitivity_grid:
  values: [-1.0, -0.6, -0.3, 0.0, 0.3, 0.6, 1.0]
  w3: cyclical_vs_defensive
  w4: benefit_from_yen_depreciation
  w5: benefit_from_higher_energy_prices
  w6: benefit_from_higher_inflation_or_interest_rates
  aggregation: market-cap-weighted arithmetic mean within each TOPIX-17 group
  post_aggregation_quantization: none
  jp_tickers:
    食品: 1617.T
    エネルギー資源: 1618.T
    建設・資材: 1619.T
    素材・化学: 1620.T
