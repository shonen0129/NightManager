    情報通信・サービスその他: 1626.T
    電力・ガス: 1627.T
    運輸・物流: 1628.T
    商社・卸売: 1629.T
    小売: 1630.T
    銀行: 1631.T
    金融（除く銀行）: 1632.T
    不動産: 1633.T

