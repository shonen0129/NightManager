evaluation:
  target: one-day 09:10-to-close return
  start_date: "2026-03-03"
  end_date: "2026-08-06"
  min_observed_etfs_per_date: 10
  only_observed_0910_target_cells: true
  primary_metric: mean daily cross-sectional Spearman rank IC
  secondary_metric: mean daily absolute error of one-day gap-adjusted mean forecast
  bootstrap:
    method: moving_block_bootstrap
    block_length_trading_dates: 20
    resamples: 5000
    seed: 20260923
  acceptance:
    min_paired_dates: 100
    min_rank_ic_improvement: 0.02
    rank_ic_difference_ci_lower_gt: 0.0
    mean_absolute_error_difference_lte: 0.0
  sensitivity_variants:
    - shift: one grid step toward zero
      role: prespecified robustness diagnostic
    - shift: one grid step away from zero
      role: prespecified robustness diagnostic
