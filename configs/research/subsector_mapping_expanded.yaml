aggregation_matrix_A:
  cols:
  - General Contractors (ゼネコン・総合建設)
  - Housing, Homebuilders & Wood Products (住宅・ハウスメーカー・木材)
  - Plant, Electrical & Telecom Engineering (設備工事・エンジニアリング・インフラ工事)
  - Housing Fixtures, Sanitary Ware & Building Openings (住宅設備・衛生陶器・建材・サッシ)
  - Comprehensive Real Estate Developers (総合不動産・ビルデベロッパー)
  - Basic & Diversified Chemicals (総合・基礎化学・エチレン・機能素材)
  - Semiconductor & Advanced Electronics Materials (半導体プロセス材料・先端電子ケミカル)
  - Advanced Films, Functional Polymers & Materials (高機能フィルム・機能性樹脂・先端素材)
  - Paints, Inks & Functional Adhesives (塗料・インキ・接着剤・コーティング材料)
  - Surfactants, Oleochemicals & Fine Chemicals (界面活性剤・油脂化学・高機能ファインケミカル)
  - Glass, Advanced Ceramics & Cement (ガラス・先端セラミックス・セメント・断熱材)
  - Paper, Packaging, Containers & Printing (紙パルプ・包装容器・印刷)
  - Integrated Steel Mills & Specialty Steel (高炉・特殊鋼・電炉・鋼板)
  - Non-Ferrous Smelting, Mining & Advanced Materials (非鉄製錬・資源鉱山・先端金属材料)
  - Optical Fiber, Power Cables & Communication Infrastructure (電線・光ファイバ・電力通信インフラ)
  - Industrial Automation, Robotics & Process Control (FA・産業ロボット・プロセス制御計装)
  - Machine Tools, Cutting & Commercial Automation (工作機械・切削工具・板金・自動化機器)
  - Construction, Mining, Defense & Heavy Machinery (建設機械・鉱山機械・防衛重工・農業機械)
  - Industrial Machinery, HVAC & Precision Bearings (産業機械・空調設備・油圧・精密ベアリング)
  - Heavy Electrical, Power Systems & Batteries (重電・電力グリッド・産業パワー・電池)
  - Semiconductors & Semiconductor Manufacturing Equipment (半導体デバイス・半導体製造装置・SPE)
  - Electronic Components, Sensors & Passive Devices (電子部品・センサ・受動部品)
  - Optical Instruments, Analytical & Precision Measurement (精密光学機器・分析計測・カメラ)
  - Medical Devices, Diagnostics & Clinical Testing (医療機器・臨床検査・生体医工学)
  - Office Printing, Consumer Electronics & Industrial Devices (オフィスOA・プリンティング・民生機器)
  - Passenger Cars, Commercial Vehicles & Motorcycles (乗用車・完成車・商用トラック・二輪)
  - Auto Parts & Systems (自動車部品・電装品・内装)
  - Tires & Rubber Products (タイヤ・ゴム製品)
  - Global Major Innovative Pharma (グローバル新薬・大型創薬)
  - Specialty Biopharma & Biotech Platforms (スペシャリティ創薬・眼科・バイオテック)
  - Consumer Healthcare, OTC, Kampo & Generics (OTC医薬品・漢方・スキンケア・後発品)
  - Beverages, Breweries & Distilling (飲料・ビール・酒類・たばこ)
  - Dairy, Probiotics & Nutritional Foods (乳業・プロバイオティクス・栄養食品)
  - Seasonings, Packaged Foods & Processed Meats (調味料・即席麺・食肉・調理加工食品)
  - Confectionery, Bakery & Snacks (製菓・スナック・製パン)
  - Grain Milling, Edible Oils, Marine & Agribusiness (製粉・製油・水産・アグリ素材)
  - Cosmetics & Personal Care (化粧品・トイレタリー・日用品)
  - Stationery, Office & Household Brands (文具・オフィス家具・楽器・生活用品)
  - Department Stores & Luxury Commercial Real Estate (百貨店・高級ブランド・都市型商業施設)
  - Supermarkets, GMS & Discount Stores (スーパー・総合小売・ディスカウントストア)
  - Drugstores & Dispensing (ドラッグストア・調剤薬局)
  - Consumer Electronics Mass Retailers (家電量販店・生活家電・免税リテール)
  - Apparel, Footwear, Sports Brands & Lifestyle SPA (アパレル・フットウェア・スポーツブランド・生活製造小売)
  - Restaurants & Food Service (外食・フードサービス)
  - General Trading Companies - Sogo Shosha (総合商社)
  - Specialized Trading - Tech, Electronics & Materials (専門商社-エレクトロニクス・機械・化学素材)
  - Specialized Trading - Pharma, Medical & Daily Goods (専門商社-医薬品・医療機器・日用品卸)
  - Megabanks & Trust Banks (メガバンク・ゆうちょ・信託)
  - Major Metropolitan & Super-Regional Banks (大都市圏・広域メガ地銀)
  - Regional & Provincial Banking Groups (地域ブロック中核地銀)
  - Digital, Retail & Specialized Banks (ネット・流通・専門銀行)
  - Securities, Exchanges & Investment (証券・取引所・投資育成)
  - Life & Non-Life Insurance (生命保険・損害保険)
  - Corporate Leasing & Capital Asset Finance (総合リース・法人設備金融)
  - Consumer Credit, Cards & Retail Finance (信販・クレジットカード・消費者金融)
  - Greater Tokyo Urban Transit & TOD (首都圏大手私鉄・都市交通・沿線再開発)
  - Kansai & Inter-Regional Private Railways (関西・広域大手私鉄・観光交通)
  - JR Group & Intercity High-Speed Rail (JR旅客鉄道グループ・新幹線幹線網)
  - Logistics, Trucking & Forwarding (トラック・総合物流・フォワーディング)
  - Marine Shipping (外航海運・海上輸送)
  - Warehousing, Harbor & Logistics Terminal (倉庫・港湾運送・ターミナル物流)
  - Airlines & Airport Infrastructure (航空・空港インフラ)
  - Electric Power Utilities (電力・発電・送配電)
  - City Gas, Industrial Gas & Energy Utilities (都市ガス・LPガス・産業ガス・エネルギー供給)
  - Energy, Petroleum Refining & Resources (エネルギー・石油元売・資源開発)
  - Telecom & Mobile Operators (通信キャリア・通信インフラ・情報流通)
  - Tech Investment, Strategic Holding & Capital Allocators (テック投資・戦略持株会社・資本アロケーター)
  - Enterprise Software, ERP & Cloud SaaS (業務ソフトウェア・ERP・クラウドSaaS)
  - Consumer Internet, Portals & E-Commerce (ネットポータル・ECモール・Webメディア)
  - Internet Infrastructure & FinTech Payments (ネットインフラ・決済代行・通信網)
  - IT Services & Enterprise SIers (大型SIer・システム受託開発・IT流通)
  - Consulting, M&A & DX Quality Services (コンサルティング・M&A・DX品質支援)
  - HR, Staffing & Relocation Services (人材・HR・総合派遣・社宅福利厚生)
  - Security, Facility Management & SMB Recurring Services (警備・施設保守・中小企業ストック支援)
  - Global Gaming Platforms & Digital Publishers (グローバルゲーム・デジタルパブリッシャー)
  - Character Toys, Anime, Film & Creative IP (キャラクター玩具・アニメ・映画・IPライセンス)
  - Pachinko & Karaoke Amusement (パチンコ遊技機・カラオケ・大衆アミューズメント)
  - Advertising Agencies & Commercial Broadcasting (広告代理店・民放テレビ放送)
  - Theme Parks, Resorts & Hotels (テーマパーク・リゾートホテル・複合レジャー)
