sensitivity_diagnostics:
  attenuation: "move each non-zero w6 magnitude one adjacent grid step toward zero"
  amplification: "move each non-zero w6 magnitude one adjacent grid step away from zero; clamp at 1.0"
  grid: [-1.0, -0.6, -0.3, 0.0, 0.3, 0.6, 1.0]
