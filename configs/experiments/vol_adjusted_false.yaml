model:
  name: production_residual_blpx
  display_name: "Production Residual-BLPX-RA v2 (mu_over_sigma + RuleD)"
  short_name: "Residual-BLPX-RA-v2"
  version: "production_residual_blpx_v2"

signal_components:
  residual_blpx:
    enabled: true
    weight: 1.0
  raw_pca:
    enabled: false
    weight: 0.0
  residual_pca:
    enabled: false
    weight: 0.0
  raw_blpx:
    enabled: false
    weight: 0.0

final_signal:
  type: residual_blpx_only
  formula: z(Residual-BLPX)

ranking:
  mode: mu_over_sigma
  score_formula: "mu_gap / sigma_gap"
  sigma_floor: 1.0e-6
  fallback_to_base_signal: true

gross_scaling:
  rule: RuleD
  pit_rolling_window: 252
  multipliers:
    Low: 0.75
    Medium: 1.00
    High: 1.00
  tertile_low_pct: 33.3333
  tertile_high_pct: 66.6667
  baseline_gross: 2.0
  fallback_multiplier: 1.00

gap_distribution:
  dir: live/pipeline_data/gap_adjusted_distribution/latest
  mu_file_pattern: "matrices/mu_gap_{date}.npy"
  omega_file_pattern: "matrices/omega_gap_{date}.npy"
  diagnostics_file: "portfolio_gap_distribution_diagnostics.csv"

portfolio:
  long_short_frac: 0.3
  n_assets: 17
  weight_mode: signal
  net_target: 0.0
  long_count: 5
  short_count: 5
  minvar_enabled: true
  minvar_alpha: 0.8

risk:
  max_gross_exposure: 3.0
  max_net_exposure: 0.05
  var_confidence: 0.99
  var_window: 250
  var_warning: 0.02
  var_stop: 0.03
  es_warning: 0.025
  es_stop: 0.04
  daily_loss_warning: 0.015
  daily_loss_stop: 0.025
  monthly_loss_stop: 0.05

costs:
  slippage_bps_per_side: 5
  cost_bps_per_gross: 10.0
  overnight_alpha_long: 0.75
  overnight_alpha_short: 0.5
  buy_interest_annual: 0.025
  borrow_fee_annual: 0.0115
  reverse_fee_bps: 2.0

blpx:
  param_set: phase1d_optimized_residual_blpx_production
  rho: 0.01
  alpha_xx: 0.20
  alpha_yx: 0.15
  alpha_yy: 0.50
  lambda_pca: 0.10
  lambda_sector: 0.60
  beta_conf: 0.25
  winsor_sigma: 3.0
  blp_window: 504
  ewma_halflife: 120
  sector_eta: 0.5
  sector_gamma: 4.0
  execution_target_cost_adjustment: none
  target: topix_residual
  use_raw_target: false
  asymmetry_mode: "scalar"
  asymmetry_delta: 0.30
  gap_open_coef_neg: 0.60
  topix_beta_coef_neg: 0.60
  vol_adjusted_target: false
  macro_confidence_enabled: true
  macro_kappas: [3.0, 0.5, 0.5]
  macro_surprise_halflife_mean: 20.0
  macro_surprise_halflife_vol: 60.0
  copula_enabled: true
  copula_blend_weight: 1.0
  copula_dynamic_blend: true
  copula_stress_threshold: 1.5
  copula_nu_init: 5.0

residualization:
  enabled_for_p3: true
  jp_market_proxy: TOPIX
  beta_window: 60
  beta_winsor_sigma: 3.0
  beta_shrinkage: 0.05
  method: rolling_ols
  lookahead_safe: true
  topix_beta_coef: 0.6

features:
  fractional_diff:
    enabled: true
    d: 0.1
    threshold: 1.0e-5
    window: 100

multi_horizon_blend:
  enabled: true
  horizons: [1, 3, 5]
  weights: [0.8, 0.1, 0.1]
  mu_file_pattern_h: "matrices/mu_gap_h{h}_{date}.npy"
  omega_file_pattern_h: "matrices/omega_gap_h{h}_{date}.npy"

cs_feature_overlay:
  enabled: true
  feature: rank_reversal
  weight: 0.05
  rank_reversal_file_pattern: "matrices/rank_reversal_{date}.npy"

fallback:
  enabled: true
  fallback_on_audit_failure: true
  fallback_on_missing_data: true
  fallback_on_invalid_confidence_variance: true
  fallback_on_sector_prior_error: true
  fallback_on_gap_data_missing: true

audit:
  enforce_signal_weighting: true
  forbid_uniform_weighting: true
  check_date_alignment: true
  check_residualization_leakage: true
  check_cost_consistency: true
  check_weight_constraints: true
  check_pit_binning_lookahead: true
  check_gap_data_freshness: true

ml_order_overlay:
  enabled: true
  model_dir: models/ml_order_overlay/phase2_8
  use_ticker: true
  use_classification: false
  per_ticker_interactions: true
  p_trade_ema_span: 0.0
  fallback_to_baseline: true

output:
  base_dir: results/production_residual_blpx
  live_dir: live/production_residual_blpx
  save_signals: true
  save_weights: true
  save_plots: true
  run_audit: true
  save_pit_binning: true
  save_scores: true
