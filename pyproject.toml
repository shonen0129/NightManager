[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadlag"
version = "2.1.0"
description = "日米ラグ市場中立戦略 — Lead-Lag Market-Neutral Strategy"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "yfinance>=1.2.0",
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "matplotlib>=3.10.0",
    "scipy>=1.17.0",
    "requests>=2.32.0",
    "python-dotenv>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0",
    "pycryptodome>=3.10.0",
    "toml>=0.10.2",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
kabu-login = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pyperclip>=1.8.2",
]
gmail = [
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.80.0",
]
nonlinear = [
    "lightgbm>=4.0.0",
    "shap>=0.46.0",
    "scikit-learn>=1.4.0",
]
calendar = [
    "jpholiday>=0.1.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.25.0",
]

[project.scripts]
leadlag = "leadlag.cli:main"

# ---------------------------------------------------------------------------
# Packaging — src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (allow sys.path.insert before import)
    "UP007",  # use X | Y for union type hints (keep Optional for 3.11 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["leadlag"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# T-P3-3: progressive strict mode.
# Newly refactored modules are checked with strict; legacy modules are
# gradually migrated. The exclude list should shrink over time.
strict = true

[[tool.mypy.overrides]]
module = ["leadlag.*"]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "leadlag.config.*",
    "leadlag.data.cache_store",
    "leadlag.data.gap_store",
]
strict = true


# ---------------------------------------------------------------------------
# import-linter (T-P3-4)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["leadlag", "research"]

[[tool.importlinter.contracts]]
name = "data does not depend on higher layers"
type = "forbidden"
source_modules = ["leadlag.data"]
forbidden_modules = [
    "leadlag.execution",
    "leadlag.cli",
    "leadlag.reporting",
]

[[tool.importlinter.contracts]]
name = "core does not do broker/CLI/execution I/O"
type = "forbidden"
source_modules = ["leadlag.core"]
forbidden_modules = [
    "leadlag.broker",
    "leadlag.data.fetcher",
    "leadlag.execution",
    "leadlag.cli",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "unit: fast unit tests with no I/O or long backtest loops",
    "integration: slower tests that run pipelines or backtest engines",
    "slow: tests that take more than a few seconds",
    "property: property-based / randomized invariants",
    "leak: look-ahead / leakage specific checks",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
]
